titulo: Escada | A.O.
categoria: interiores
ano: 2023
resumo: >-
  Nesta sala, aproveitamos cada canto, incluindo uma área embaixo da escada,
  para criar um cantinho especial de devoção familiar. Os vários armários para
  armazenamento em tons claros, painel ripado em madeira e iluminação indireta
  trazem ainda mais conforto e harmonia ao ambiente.
