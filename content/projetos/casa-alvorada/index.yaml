titulo: CASA ALVORADA
categoria: residenciais
ano: 2024
resumo: >-
  Residência unifamiliar que integra luz natural, ventilação cruzada e
  materiais brutos em uma narrativa de acolhimento.
descricao: >-
  A Casa Alvorada nasce da vontade de criar um refúgio que dialoga com a
  paisagem. A implantação privilegia a orientação solar e a ventilação natural,
  enquanto os materiais — concreto aparente, madeira e pedra — envelhecem com
  graça. Os espaços fluem entre interior e exterior através de grandes vãos,
  tornando a natureza parte integrante da vivência diária.
