titulo: APARTAMENTO JARDIM
categoria: interiores
ano: 2024
resumo: >-
  Reforma de apartamento que traz o verde para dentro de casa, com
  vegetação integrada aos ambientes sociais.
descricao: >-
  O Apartamento Jardim transforma um imóvel convencional em um oásis urbano. A
  intervenção reorganizou a planta para maximizar a entrada de luz e criar
  conexão visual com o jardim vertical na varanda. Paleta neutra, marcenaria
  sob medida e iluminação cênica compõem ambientes de serenidade, onde cada
  detalhe — dos revestimentos à escolha das plantas — foi pensado para o
  bem-estar dos moradores.
