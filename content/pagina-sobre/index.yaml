tituloPrincipal: Arquitetura que
tituloItalico: respira.
lead: >-
  Acreditamos em espaços que contam histórias. Uma abordagem autoral que foge
  do óbvio corporativo para abraçar a textura, a luz natural e a verdadeira
  essência de quem habita.
nota: >-
  Fundado por Luiza Tinoco, o escritório une o rigor técnico à sensibilidade
  estética, criando lares atemporais, sofisticados e, acima de tudo,
  acolhedores.
retrato: sobre-retrato.webp
visaoLabel: NOSSA VISÃO
visaoTitulo: |-
  Sofisticação
  Minimalista
visaoQuote: >-
  "O luxo contemporâneo não reside no excesso, mas na curadoria precisa do
  essencial. É o espaço para respirar, a escolha tátil dos materiais e a luz
  desenhando os contornos do cotidiano."
